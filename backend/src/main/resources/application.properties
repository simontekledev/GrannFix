spring.application.name=GrannFix
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/grannfix}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
server.address=0.0.0.0
server.port=8080

spring.mail.host=${MAIL_HOST:smtp.resend.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:resend}
spring.mail.password=${MAIL_PASSWORD:}
app.mail.from=${MAIL_FROM:onboarding@resend.dev}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
management.health.mail.enabled=false

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
app.upload.dir=${UPLOAD_DIR:uploads}

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# BankID via Criipto (OIDC). Set CRIIPTO_DOMAIN/CLIENT_ID/CLIENT_SECRET in .env.
criipto.domain=${CRIIPTO_DOMAIN:}
criipto.client-id=${CRIIPTO_CLIENT_ID:}
criipto.client-secret=${CRIIPTO_CLIENT_SECRET:}
app.bankid.mobile-callback-scheme=${MOBILE_CALLBACK_SCHEME:mobile}

